name: Evaluate (paper only)
on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if the market is closed (uses stored bars)"
        type: boolean
        default: false
concurrency:
  group: spxai-state
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Gate (skip outside regular hours)
        id: gate
        run: |
          H=$(TZ=America/New_York date +%H%M); D=$(TZ=America/New_York date +%u)
          if [ "$D" -le 5 ] && [ "$H" -ge 0930 ] && [ "$H" -lt 1601 ]; then echo "open=true" >> "$GITHUB_OUTPUT"; else echo "open=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.open == 'true' || inputs.force
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.open == 'true' || inputs.force
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-core.txt
      - name: Install
        if: steps.gate.outputs.open == 'true' || inputs.force
        run: pip install -r requirements-core.txt
      - name: Check out state branch
        if: steps.gate.outputs.open == 'true' || inputs.force
        run: bash scripts/prepare_state.sh
      - name: Evaluate
        if: steps.gate.outputs.open == 'true' || inputs.force
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m spxai.runner evaluate ${{ inputs.force && '--force' || '' }}
      - name: Publish state
        if: always() && (steps.gate.outputs.open == 'true' || inputs.force)
        run: bash scripts/publish_state.sh
